name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a running main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittest:
    name: unittest (CPU, Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # --extra cpu installs the CPU builds of torch and torchvision.
      - name: Install
        run: uv sync --locked --extra cpu

      # --no-sync keeps uv run from swapping in the default (CUDA) torch build.
      # Tests that need CUDA or the lab's datasets skip themselves.
      - name: Run tests
        run: uv run --no-sync python -m unittest discover tests --durations 10
